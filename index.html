<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Urban Shop Espace recrue : scénario interactif d'économie-droit pour les 2MRC, module 1 (M. Frison).">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Urban Shop Espace recrue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : univers streetwear d'Urban Shop. Cartes « stickers » (bord épais + ombre décalée), plan du magasin en 5 zones à débloquer, étiquettes-prix et ticket de caisse comme repères de jeu. */
:root{
  --bg:#EEF0FF; --dots:#D3D8F6; --surface:#FFFFFF; --surface-2:#F5F6FF; --ink:#1B1446; --muted:#5A5683; --line:#D9DBF0;
  --edge:#1B1446; --on-edge:#FFFFFF;
  --tag:#FFD23F; --tag-ink:#1B1446; --pink:#FF5D8F; --mint:#1FBFA3;
  --eco:#3756F5; --eco-soft:#E3E8FF; --droit:#8B45F0; --droit-soft:#F0E6FF;
  --ok:#12A160; --ok-soft:#DDF7EA; --no:#E2412F; --no-soft:#FFE6E2;
  --f-logo:"Bungee", "Arial Black", Impact, sans-serif;
  --f-display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px; --sh:5px 5px 0 var(--edge);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#120F2B; --dots:#221D4A; --surface:#1D1840; --surface-2:#26204F; --ink:#F1EEFF; --muted:#A9A3D6; --line:#3A3370;
  --edge:#05030F; --on-edge:#FFFFFF; --tag:#FFD23F; --tag-ink:#1B1446; --pink:#FF6F9C; --mint:#3DDBBF;
  --eco:#8098FF; --eco-soft:#232C66; --droit:#B98BFF; --droit-soft:#34245E;
  --ok:#3FD38A; --ok-soft:#143A2A; --no:#FF7A68; --no-soft:#45201B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#120F2B; --dots:#221D4A; --surface:#1D1840; --surface-2:#26204F; --ink:#F1EEFF; --muted:#A9A3D6; --line:#3A3370;
  --edge:#05030F; --on-edge:#FFFFFF; --tag:#FFD23F; --tag-ink:#1B1446; --pink:#FF6F9C; --mint:#3DDBBF;
  --eco:#8098FF; --eco-soft:#232C66; --droit:#B98BFF; --droit-soft:#34245E;
  --ok:#3FD38A; --ok-soft:#143A2A; --no:#FF7A68; --no-soft:#45201B; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg) radial-gradient(var(--dots) 1.5px, transparent 1.6px) 0 0/22px 22px;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05}
p{margin:0}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.sticker{background:var(--surface);border:3px solid var(--edge);border-radius:var(--r);box-shadow:var(--sh)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--edge);color:var(--on-edge);border-bottom:3px solid var(--edge)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:9px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0;color:inherit}
.brand b{font-family:var(--f-logo);font-weight:400;font-size:21px;color:var(--tag);letter-spacing:.02em}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:700}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px}
.xp-pill{background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-weight:700;padding:4px 11px;border-radius:999px;font-size:13px}
.snd{background:transparent;border:2px solid rgba(255,255,255,.35);color:inherit;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--edge);background:var(--surface);color:var(--ink);font-weight:700;padding:11px 20px;border-radius:12px;cursor:pointer;text-decoration:none;font-size:16px;box-shadow:4px 4px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--edge)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
.btn.tagb{background:var(--tag);color:var(--tag-ink)}
.btn.pinkb{background:var(--pink);color:#fff}
.btn.ghost{background:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

/* Hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;padding-block:34px 26px;align-items:center}
.hero>div{min-width:0}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero h1{font-size:clamp(36px,5.6vw,64px);font-weight:800;letter-spacing:-.03em;margin-block:12px 16px}
.hero h1 em{font-style:normal;font-family:var(--f-logo);font-weight:400;font-size:.82em;letter-spacing:0;background:var(--tag);color:var(--tag-ink);padding:.02em .25em;border:3px solid var(--edge);border-radius:10px;display:inline-block;transform:rotate(-2deg);box-shadow:4px 4px 0 var(--edge)}
.lead{color:var(--muted);max-width:54ch;font-size:18px}
.name-form{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}
.name-form input{flex:1 1 220px;min-width:0;font:inherit;padding:12px 14px;border:3px solid var(--edge);border-radius:12px;background:var(--surface);color:var(--ink)}
.store svg{width:100%;height:auto;display:block;max-width:520px;margin-inline:auto;filter:drop-shadow(6px 6px 0 var(--edge))}
.s-wall{fill:var(--surface);stroke:var(--edge)} .s-edge{fill:var(--edge)} .s-tag{fill:var(--tag)} .s-pink{fill:var(--pink)} .s-mint{fill:var(--mint)} .s-eco{fill:var(--eco)} .s-glass{fill:var(--eco-soft);stroke:var(--edge)} .s-white{fill:#fff} .s-str{stroke:var(--edge);fill:none}
.store .logo{font-family:var(--f-logo);fill:var(--tag)}
.store .open{font-family:var(--f-logo);fill:var(--tag-ink)}
@media (prefers-reduced-motion:no-preference){ .store .swing{transform-origin:332px 150px;animation:swing 3s ease-in-out infinite} }
@keyframes swing{50%{transform:rotate(6deg)}}

/* Badge + module */
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:22px;margin-bottom:30px;align-items:start}
.badge{position:relative;padding:30px 20px 18px;background:var(--surface)}
.badge::before{content:"";position:absolute;top:10px;left:50%;width:56px;height:9px;margin-left:-28px;border-radius:9px;background:var(--bg);border:2px solid var(--edge)}
.badge-head{display:flex;gap:14px;align-items:center}
.avatar{width:66px;height:66px;border-radius:14px;background:var(--pink);color:#fff;display:grid;place-items:center;font-family:var(--f-logo);font-size:30px;flex:none;border:3px solid var(--edge)}
.badge-head .nm{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1}
.badge-head .rk{display:inline-block;margin-top:4px;background:var(--edge);color:var(--on-edge);font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.meter{margin-top:16px}
.meter-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700}
.bar{height:16px;border-radius:10px;background:var(--surface-2);border:2.5px solid var(--edge);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--tag) 0 10px,#FFC000 10px 20px);transition:width .6s}
.small{font-size:13px;color:var(--muted)}
.medals{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px}
.medal{aspect-ratio:1;border-radius:50%;border:2.5px dashed var(--line);display:grid;place-items:center;font-family:var(--f-logo);color:var(--muted);font-size:15px}
.medal.on{border:3px solid var(--edge);color:var(--tag-ink)}
.medal.on.z5{background:var(--edge);color:var(--tag)} .medal.on.z0{background:var(--tag)} .medal.on.z1{background:var(--pink);color:#fff} .medal.on.z2{background:var(--mint)} .medal.on.z3{background:var(--eco);color:#fff} .medal.on.z4{background:var(--droit);color:#fff}
.badge-foot{margin-top:14px;padding-top:10px;border-top:2px dashed var(--line);display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.mod{padding:18px 20px}
.mod h2{font-size:21px;font-weight:800;margin-block:6px 12px}
.mod ol{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.mod li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline}
.mod li>span:nth-child(2){min-width:0}
.mod .tn{font-family:var(--f-logo);font-size:13px;color:var(--pink)}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:2px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--surface)}
.pill.done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.pill.progress{background:var(--eco-soft);color:var(--eco);border-color:var(--eco)}

.comp-h{font-size:17px;font-weight:800;margin-block:18px 10px}
.comps{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.comp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface-2)}
.comp>span:nth-child(2){min-width:0}
.comp .cbox{width:26px;height:26px;border-radius:8px;border:2.5px solid var(--edge);display:grid;place-items:center;font-weight:800;background:var(--surface)}
.comp.done{border-color:var(--ok);background:var(--ok-soft)} .comp.done .cbox{background:var(--ok);color:#fff}
.zcomp{font-size:14px;font-weight:700;border-top:2px dashed var(--line);padding-top:8px}
.zcomp span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--pink)}
@media (max-width:600px){ .comp{grid-template-columns:auto 1fr} .comp .pill{grid-column:2;justify-self:start} }
.vcode{margin-top:16px;border:3px dashed var(--edge);border-radius:14px;padding:12px 14px;display:grid;gap:4px;background:var(--surface-2)}
.vcode b{font-size:26px;letter-spacing:.08em;color:var(--ink)}
.rcode{font-size:20px;font-weight:700;letter-spacing:.08em}
.profbox{width:100%;max-width:560px;padding:22px;display:grid;gap:12px}
.profbox h2{font-size:24px;font-weight:800}
.pres-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pres-h>div{min-width:0;flex:1}
.chkform{display:grid;gap:6px}
.chkform label{font-weight:700;font-size:14px;margin-top:4px}
.chkform input{font:inherit;padding:10px 12px;border:3px solid var(--edge);border-radius:12px;background:var(--surface-2);color:var(--ink)}
.chkform input.mono{font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.chkform .btn{justify-self:start;margin-top:8px}
.pres{border:3px solid var(--ok);background:var(--ok-soft);border-radius:14px;padding:14px;display:grid;gap:8px}
.pres ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.pres li{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;flex-wrap:wrap;opacity:.6}
.pres li.ok{opacity:1;font-weight:700}
.pres li .stars svg{width:18px;height:18px}
.sep{border:0;border-top:2px dashed var(--line);margin:4px 0;width:100%}
.savebox{margin-top:14px;display:grid;gap:8px}
.savebox .btn{justify-content:center}
.filebtn{position:relative;font-size:14px;padding:8px 14px}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.filebtn:focus-within{outline:3px solid var(--pink);outline-offset:3px}
.savemsg{font-size:14px;font-weight:700;color:var(--ok)}
.savemsg.ko{color:var(--no)}
.row.is-bad{border-color:var(--no);background:var(--no-soft)}
.qbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:16px}
.qprog{flex:1 1 100%;height:12px;border:2.5px solid var(--edge);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.qprog i{display:block;height:100%;background:var(--pink);transition:width .3s}
.notecard{margin-top:20px;display:grid;gap:6px;justify-items:start;border:3px solid var(--edge);border-radius:18px;padding:18px 20px;box-shadow:5px 5px 0 var(--edge)}
.notecard.good{background:var(--ok-soft)} .notecard.bad{background:var(--no-soft)}
.notecard b{font-family:var(--f-logo);font-weight:400;font-size:54px;line-height:1}
.notecard b small{font-size:24px}
.notecard.inline{margin:0 0 18px;display:inline-grid}
.grille table{width:100%;border-collapse:collapse;border:3px solid var(--edge);border-radius:14px;overflow:hidden;min-width:620px}
.grille th,.grille td{text-align:left;padding:11px 12px;border-bottom:2px solid var(--line);vertical-align:top;font-size:15px}
.grille thead th{background:var(--edge);color:var(--on-edge);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.grille tbody th{font-family:var(--f-display);font-size:16px;width:32%}
.lvchip{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;border:2px solid var(--edge);white-space:nowrap}
.lvchip.r0,.lvchip.s0{background:var(--no);color:#fff} .lvchip.r1,.lvchip.s1{background:var(--tag);color:var(--tag-ink)} .lvchip.r2,.lvchip.s2{background:var(--ok);color:#fff} .lvchip.sx{background:var(--surface-2)}
.note.good{color:var(--ok)} .note.bad{color:var(--no)}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:16px}
.fcard{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:start;background:var(--surface);border:3px solid var(--edge);border-radius:18px;padding:16px;box-shadow:5px 5px 0 var(--edge)}
.fcard>div{min-width:0}
.fcard .fnum{width:46px;height:46px;border-radius:12px;border:3px solid var(--edge);background:var(--c);display:grid;place-items:center;font-family:var(--f-logo);font-size:20px;color:var(--t)}
.fcard h3{font-size:18px;font-weight:800}
.fcard .actions{grid-column:1 / -1;margin:0}
.fcard .btn{padding:8px 14px;font-size:15px}
.dlrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:36px}
.fiche{background:var(--surface);border:3px solid var(--edge);border-radius:22px;box-shadow:8px 8px 0 var(--edge);overflow:hidden;margin-block:12px 22px}
.fband{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px clamp(16px,3.5vw,34px);font-weight:700;font-size:14px;border-bottom:3px solid var(--edge)}
.fband b{font-family:var(--f-logo);font-weight:400;font-size:17px}
.fin{padding:20px clamp(16px,3.5vw,34px) 28px}
.fin h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em}
.fin .zcomp{margin-top:10px}
.fh{font-size:15px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;border-left:6px solid var(--c);padding-left:10px;margin-block:22px 10px;color:var(--ink)}
.fdefs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.fdef{border:3px solid var(--edge);border-radius:14px;padding:12px 14px;box-shadow:3px 3px 0 var(--edge)}
.fdef.eco{background:var(--eco-soft)} .fdef.droit{background:var(--droit-soft)}
.fdef b{font-family:var(--f-display);font-size:18px}
.ftable{width:100%;border-collapse:collapse;border:2.5px solid var(--edge);min-width:560px}
.ftable th{background:var(--c);color:#fff;text-align:left;padding:8px 10px;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.ftable td{padding:8px 10px;border-top:1.5px solid var(--line);vertical-align:top;font-size:15px}
.ftable tbody tr:nth-child(even) td{background:var(--surface-2)}
.fbox{border:3px solid var(--edge);border-radius:14px;padding:12px 16px;font-size:18px;background:var(--surface-2)}
.fbox.tag,.fbox.tagstrong{background:var(--tag);color:var(--tag-ink)} .fbox.center{text-align:center}
.ftext{max-width:75ch}
.fbul{margin:0;padding-left:22px;display:grid;gap:6px} .fbul li::marker{color:var(--pink)}
.fpiege{margin-top:20px;border:3px solid var(--pink);background:var(--no-soft);border-radius:14px;padding:12px 16px}
.fpiege span{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--pink);margin-bottom:4px}
.fcheck{display:grid;gap:8px}
.fcheck details{border:2.5px solid var(--edge);border-radius:12px;padding:10px 14px;background:var(--surface)}
.fcheck summary{cursor:pointer;font-weight:700}
.fcheck details[open]{background:var(--ok-soft)}
.fcheck details p{margin-top:6px}
.fnav{align-items:center}
.flashzone{max-width:640px;margin:10px auto 50px;display:grid;gap:16px}
.fprog{display:flex;gap:12px;align-items:center}
.fprog .qprog{flex:1}
.fprog .ok{color:var(--ok);font-weight:700}
.flip{position:relative;display:block;width:100%;min-height:280px;border:0;padding:0;background:none;cursor:pointer;perspective:1200px;text-align:center}
.flip .face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:24px;border:3px solid var(--edge);border-radius:22px;box-shadow:6px 6px 0 var(--edge);backface-visibility:hidden;transition:transform .45s}
.flip .front{background:var(--surface)}
.flip .back{background:var(--c);color:var(--t);transform:rotateY(180deg)}
.flip.on .front{transform:rotateY(-180deg)} .flip.on .back{transform:rotateY(0)}
.flip .ft{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,3.4vw,28px);line-height:1.25;max-width:30ch}
.flip .back .ft{font-family:var(--f-body);font-weight:700;font-size:clamp(17px,2.6vw,21px)}
.flip .back .kicker{color:inherit;opacity:.85}
.fchoice{justify-content:center}
.fend{padding:26px;display:grid;gap:10px;justify-items:center;text-align:center}
.fend .big{font-family:var(--f-logo);font-size:56px;font-weight:400}
@media (prefers-reduced-motion:reduce){ .flip .face{transition:none} .flip .back{display:none} .flip.on .back{display:flex} .flip.on .front{display:none} }
@media (max-width:900px){ .fgrid{grid-template-columns:1fr} }
/* Store map */
.sec-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-block:8px 16px;flex-wrap:wrap}
.sec-title h2{font-family:var(--f-logo);font-weight:400;font-size:clamp(22px,3vw,30px);letter-spacing:.01em}
.map{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px;padding:22px;border:3px dashed var(--muted);border-radius:22px;margin-bottom:34px;background:repeating-linear-gradient(0deg,transparent 0 47px,var(--line) 47px 48px),repeating-linear-gradient(90deg,transparent 0 47px,var(--line) 47px 48px)}
.zone{grid-column:span 2;position:relative;display:flex;flex-direction:column;gap:8px;padding:18px 18px 16px;background:var(--surface);border:3px solid var(--edge);border-radius:18px;box-shadow:6px 6px 0 var(--edge);min-width:0}

.zone .zhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.zone .zlabel{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:3px 10px;border:2px solid var(--edge);border-radius:999px;color:var(--tag-ink)}
.zone .zic{width:54px;height:54px;border-radius:14px;border:3px solid var(--edge);display:grid;place-items:center;flex:none;color:var(--tag-ink)}
.zone .zic svg{width:30px;height:30px}
.z5 .zlabel,.z5 .zic{background:var(--edge);color:var(--tag)} .z0 .zlabel,.z0 .zic{background:var(--tag)} .z1 .zlabel,.z1 .zic{background:var(--pink);color:#fff} .z2 .zlabel,.z2 .zic{background:var(--mint)} .z3 .zlabel,.z3 .zic{background:var(--eco);color:#fff} .z4 .zlabel,.z4 .zic{background:var(--droit);color:#fff}
.zone .znum{font-family:var(--f-logo);font-size:13px;color:var(--muted)}
.zone h3{font-size:21px;font-weight:800}
.zone .q{color:var(--muted);font-size:14.5px}

.zone.cur{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:6px 6px 0 var(--edge),0 0 0 8px color-mix(in srgb,var(--tag) 45%,transparent)}}
.cert{background:var(--edge);color:var(--on-edge);border-radius:20px;padding:24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:28px;border:3px solid var(--edge);box-shadow:6px 6px 0 var(--pink)}
.cert h3{font-size:26px}
.cert .stamp{width:96px;height:96px;border-radius:50%;border:4px solid var(--tag);color:var(--tag);display:grid;place-items:center;text-align:center;font-family:var(--f-logo);font-size:12px;transform:rotate(-10deg);flex:none;line-height:1.2}

/* Mission header */
.mhead{padding-block:20px 6px}
.back{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-weight:700;font-size:15px}
.mtitle{display:flex;gap:16px;align-items:center;margin-top:14px}
.mtitle .zic{width:64px;height:64px;border-radius:16px;border:3px solid var(--edge);display:grid;place-items:center;flex:none;box-shadow:4px 4px 0 var(--edge)}
.mtitle .zic svg{width:36px;height:36px}
.mtitle>div{min-width:0}
.mhead h1{font-size:clamp(28px,4.2vw,44px);font-weight:800;letter-spacing:-.02em;margin-block:4px}
.prob{color:var(--muted);max-width:70ch;margin-top:6px}
.prob b{color:var(--ink)}
.ref{margin-top:14px;border:2.5px solid var(--edge);border-radius:14px;padding:12px 16px;background:var(--surface);display:grid;gap:8px;max-width:840px}

.streak{margin-left:auto;font-family:var(--f-logo);font-size:14px;background:var(--pink);color:#fff;border:2.5px solid var(--edge);border-radius:999px;padding:4px 12px;box-shadow:3px 3px 0 var(--edge)}
.stage{background:var(--surface);border:3px solid var(--edge);border-radius:22px;box-shadow:8px 8px 0 var(--edge);padding:26px clamp(16px,3.5vw,36px) 30px;margin-bottom:22px}
.ptag{display:inline-flex;align-items:center;background:var(--tag);color:var(--tag-ink);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:6px 16px 6px 26px;position:relative;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%);border-radius:0 8px 8px 0;transform:rotate(-2deg)}
.ptag::before{content:"";position:absolute;left:13px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--surface)}
.stage h2{font-size:clamp(24px,3.2vw,32px);font-weight:800;margin-block:14px 6px;letter-spacing:-.01em}

.navbar{display:flex;justify-content:space-between;gap:10px;padding-bottom:44px;flex-wrap:wrap}

/* Speech */
.speech{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:end}
.speech .av{width:96px;flex:none}
.speech .av svg{width:96px;height:auto;display:block}
.speech .bub{position:relative;background:var(--surface-2);border:3px solid var(--edge);border-radius:20px 20px 20px 4px;padding:16px 20px;max-width:68ch;min-width:0;box-shadow:4px 4px 0 var(--edge)}
.speech .bub .from{font-size:13px;font-weight:700;color:var(--pink);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
.speech .bub p+p{margin-top:10px}
.objs{margin-top:22px;display:grid;gap:8px}
.objs ul{margin:0;padding:0;display:grid;gap:8px}
.objs li{list-style:none;display:flex;gap:10px;align-items:baseline}
.objs li::before{content:"";width:12px;height:12px;border:2.5px solid var(--edge);border-radius:3px;flex:none;transform:translateY(1px);background:var(--tag)}
.defbox{margin-top:20px;border:3px solid var(--edge);border-radius:16px;padding:16px 20px;font-size:19px;max-width:72ch;background:var(--tag);color:var(--tag-ink);box-shadow:4px 4px 0 var(--edge)}

.defbox:has(.circuit){background:var(--surface);color:var(--ink)}
.circuit{margin:0;overflow-x:auto}

.circuit rect{fill:var(--surface-2);stroke:var(--edge)} .circuit .lab{fill:var(--ink)} .circuit .ahp{fill:var(--ink)}
.circuit path.e{stroke:var(--eco)} .circuit path.d{stroke:var(--droit)} .circuit .te{fill:var(--eco)} .circuit .td{fill:var(--droit)}

/* Rows */
.rows{display:grid;gap:14px}
.row{border:2.5px solid var(--edge);border-radius:16px;padding:14px 16px;background:var(--surface);transition:background .2s}
.row.is-ok{background:var(--ok-soft);border-color:var(--ok)}
.row-q{font-weight:700;margin-bottom:10px;min-width:0}

.flow{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;margin-right:8px}
.ag{background:var(--surface-2);border:2px solid var(--edge);border-radius:8px;padding:1px 9px;font-size:15px}
.arr{font-weight:800;color:var(--pink);font-size:20px;line-height:1}
.big-q{font-size:20px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:2.5px solid var(--edge);background:var(--surface);border-radius:11px;padding:8px 15px;cursor:pointer;font-weight:700;font-size:15px;text-align:left;box-shadow:3px 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--edge)}
.opt:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.opt.eco{color:var(--eco);background:var(--eco-soft)}
.opt.droit{color:var(--droit);background:var(--droit-soft)}
.opt.both{background:linear-gradient(90deg,var(--eco-soft),var(--droit-soft))}
.opt.ok{background:var(--ok);border-color:var(--edge);color:#fff;animation:pop .35s}
.opt.no{background:var(--no-soft);border-color:var(--no);color:var(--no);animation:shake .3s}
.opt:disabled:not(.ok){opacity:.4;cursor:default;box-shadow:none}
.why{margin-top:10px;font-size:15px;color:var(--ink)}
.why.no{color:var(--no);font-weight:700}
.why b{color:var(--ok)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.12)}}
.xpfly{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--ok);margin-left:6px}

/* Fill */
.fill{font-size:19px;line-height:2.4;max-width:74ch}
.blank{display:inline-block;min-width:130px;border:2.5px dashed var(--edge);background:var(--surface-2);border-radius:10px;padding:0 12px;line-height:1.7;cursor:pointer;font-weight:700;text-align:center;vertical-align:baseline;font-size:18px}
.blank.act{background:var(--tag);color:var(--tag-ink);border-style:solid}
.blank.ok{background:var(--ok-soft);border:2.5px solid var(--ok);color:var(--ok);cursor:default}
.blank.no{background:var(--no-soft);border:2.5px solid var(--no);color:var(--no)}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-block:20px 18px;padding:16px;border:3px dashed var(--muted);border-radius:16px;background:var(--surface-2)}
.bank-label{width:100%;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chip{border:2.5px solid var(--edge);background:var(--surface);border-radius:999px;padding:6px 16px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:3px 3px 0 var(--edge)}
.chip:nth-child(5n+2){background:var(--tag);color:var(--tag-ink)} .chip:nth-child(5n+3){background:var(--mint);color:var(--tag-ink)} .chip:nth-child(5n+4){background:var(--pink);color:#fff} .chip:nth-child(5n+5){background:var(--eco-soft);color:var(--eco)}
.chip:disabled{opacity:.25;cursor:default;box-shadow:none}
.feedback{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:700;border:2.5px solid currentColor}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.no{background:var(--no-soft);color:var(--no)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

/* Multi */
.mopts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.mopt{display:flex;gap:12px;align-items:center;border:2.5px solid var(--edge);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;font-weight:700;text-align:left;box-shadow:3px 3px 0 var(--edge)}
.mopt .box{width:24px;height:24px;border:2.5px solid var(--edge);border-radius:6px;flex:none;display:grid;place-items:center;font-size:14px}

.mopt.sel .box{background:var(--edge);color:#fff}
.mopt.ok{background:var(--ok-soft);color:var(--ok)}
.mopt.no{background:var(--no-soft);color:var(--no)}

/* Open */
textarea{width:100%;min-height:120px;font:inherit;padding:12px 14px;border:3px solid var(--edge);border-radius:14px;background:var(--surface-2);color:var(--ink);resize:vertical}
.model{margin-top:16px;border:2.5px solid var(--eco);background:var(--eco-soft);padding:12px 16px;border-radius:14px}
.model .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--eco);margin-bottom:4px}
.hint{font-size:15px;color:var(--muted);margin-bottom:10px}

/* Video */
.video{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.vcard{display:block;text-decoration:none;background:var(--pink);color:#fff;border-radius:18px;border:3px solid var(--edge);box-shadow:6px 6px 0 var(--edge);position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden}
.vcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent 0 18px,rgba(255,255,255,.12) 18px 36px)}
.vcard .play{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;background:var(--tag);border:3px solid var(--edge);display:grid;place-items:center}
.vcard .play::after{content:"";border-left:22px solid var(--tag-ink);border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
.vcard .vt{position:absolute;left:18px;bottom:14px;right:18px;font-family:var(--f-display);font-weight:800;font-size:20px}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:center;border:2.5px solid var(--edge);border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:700;background:var(--surface)}
.checks label:has(input:checked){background:var(--mint);color:var(--tag-ink)}
.checks input{width:20px;height:20px;accent-color:var(--edge)}

/* Sim */
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:26px;align-items:start}
.sim label{display:flex;justify-content:space-between;font-weight:700;margin-top:6px}
.sim input[type=range]{width:100%;margin-block:8px 14px;accent-color:var(--pink);height:28px}
.presets{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.sview{background:var(--surface-2);border:3px solid var(--edge);border-radius:18px;padding:18px;box-shadow:5px 5px 0 var(--edge)}
.sbar{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:14px;font-weight:700;margin-bottom:10px}
.sbar .track{height:22px;background:var(--surface);border:2.5px solid var(--edge);border-radius:8px;overflow:hidden}
.sbar .track i{display:block;height:100%;transition:width .3s}
.sbar.o i{background:var(--eco)} .sbar.d i{background:var(--pink)}
.price{display:flex;align-items:center;gap:16px;margin-top:16px;flex-wrap:wrap}
.price .tagp{background:var(--tag);color:var(--tag-ink);font-family:var(--f-logo);font-size:32px;padding:6px 18px 6px 32px;clip-path:polygon(16px 0,100% 0,100% 100%,16px 100%,0 50%);border-radius:0 10px 10px 0;transform:rotate(-3deg)}
.price .trend{font-family:var(--f-display);font-weight:800;font-size:22px}
.verdict{margin-top:12px;font-size:16px}

.essentiel{margin-top:18px;background:var(--pink);color:#fff;border:3px solid var(--edge);border-radius:16px;padding:14px 18px;font-weight:700;font-size:18px;box-shadow:4px 4px 0 var(--edge)}
.tbl-wrap{overflow-x:auto}

.lv button.on.l1{background:var(--tag);color:var(--tag-ink)}
.lv button.on.l2{background:var(--ok);color:#fff}

.conf{position:fixed;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:50;animation:conf .9s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes conf{to{transform:translate(var(--dx),calc(var(--dy) + 140px)) rotate(var(--rot));opacity:0}}
.floaty{position:fixed;z-index:51;pointer-events:none;font-family:var(--f-logo);font-size:22px;color:var(--ok);-webkit-text-stroke:1px var(--edge);animation:floaty 1s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes floaty{to{transform:translate(-50%,-140%);opacity:0}}

  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;animation:print .7s ease-out}
@keyframes print{from{transform:translateY(-40px);opacity:0}}
.receipt h3{font-family:var(--f-logo);font-weight:400;text-align:center;font-size:24px}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1.5px dashed #16181D;margin:12px 0}
.receipt .ln{display:flex;justify-content:space-between;gap:10px}
.receipt .ln span:first-child{min-width:0}
.receipt .tot{font-size:18px;font-weight:700}
.receipt .rstars{display:flex;justify-content:center;gap:6px;margin-top:8px}
.receipt .rstars svg{width:34px;height:34px}
.receipt .rstars .on{fill:#FFD23F;stroke:#16181D} .receipt .rstars .off{fill:#eee;stroke:#bbb}
.receipt .btn{width:100%;justify-content:center;margin-top:18px;background:#16181D;border-color:#16181D;color:#FBFAF6;box-shadow:none}
.receipt .bcode{height:40px;margin-top:14px;background:repeating-linear-gradient(90deg,#16181D 0 2px,transparent 2px 4px,#16181D 4px 7px,transparent 7px 8px,#16181D 8px 9px,transparent 9px 12px)}

footer{padding-block:18px 30px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center;border-top:2px dashed var(--line);padding-top:16px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}

@media (max-width:900px){
  .hero,.duo{grid-template-columns:1fr}
  .store{order:-1} .store svg{max-width:420px}
  .map{grid-template-columns:1fr;padding:14px;gap:18px}
  .zone{grid-column:auto}
  .video,.sim{grid-template-columns:1fr}
}
@media (max-width:600px){
  .mod li{grid-template-columns:auto 1fr} .mod li .pill{grid-column:2;justify-self:start}
  .retiens th{width:auto;display:block;padding-bottom:4px} .retiens td{display:block}
  .retiens tr{display:block;border-bottom:2px solid var(--line)} .retiens tr:last-child{border-bottom:0}

  .sbar{grid-template-columns:80px 1fr 40px}
  .stage{box-shadow:5px 5px 0 var(--edge)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
async function saveDocx() {
  const bin = atob(FICHES_DOCX_B64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  const fname = "Fiches_synthese_Urban_Shop_2MRC.docx";
  let dl = null;
  try {
    dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  } catch (e) {
    dl = null;
  }
  try {
    if (dl) {
      await dl.save({ filename: fname, data: u });
    } else {
      const url = URL.createObjectURL(new Blob([u], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4e3);
    }
    V.saveMsg = { t: "Fiches enregistr\xE9es dans \xAB ".concat(fname, " \xBB.") };
  } catch (err) {
    V.saveMsg = err && err.code === "declined" ? { t: "T\xE9l\xE9chargement annul\xE9." } : { ko: true, t: "Le t\xE9l\xE9chargement n'a pas fonctionn\xE9 ici." };
  }
  render();
}
